<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Valuation Phases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2>{{ session.type }} Valuation - {{ session.academic_year }} ({{ session.sem_type }} Sem)</h2>
    <h5 class="mb-4">Select a Phase to Manage Data</h5>
    
    <div class="row">
        {% for p in phases %}
        <div class="col-md-4 mb-3">
            <div class="card shadow-sm p-3 border-start border-4 border-primary">
                <h4>Phase {{ p.phase_number }}</h4>
                <p class="text-muted">{{ p.start_date }} to {{ p.end_date }}</p>
                <a href="/valuation_hub/{{ p.id }}" class="btn btn-primary">Enter Phase {{ p.phase_number }}</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
</body>
</html>

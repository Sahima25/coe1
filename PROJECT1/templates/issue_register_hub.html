<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Issue Register Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style> body { background-color: #f8f9fa; } .card { border-radius: 12px; border: none; } </style>
</head>
<body class="p-4">

<div class="container" style="max-width: 500px; margin-top: 80px;">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-danger"><i class="fas fa-book-open me-2"></i> Issue Register Engine</h2>
        <p class="text-muted">Enter Faculty ID to compute packets and dynamic dummy numbers.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card shadow-lg p-5">
        <form action="/preview_issue_register/{{ phase_id }}" method="POST">
            <div class="mb-4">
                <label class="form-label fw-bold text-muted">Faculty ID (From Master DB)</label>
                <input type="text" name="faculty_id" class="form-control form-control-lg border-danger" placeholder="e.g. FAC001" required>
            </div>
            <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold shadow">
                <i class="fas fa-calculator me-2"></i> Compute Sequence & Preview
            </button>
            <div class="text-center mt-3">
                <a href="/valuation_hub/{{ phase_id }}" class="text-secondary text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Back to Phase Hub</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>GCE Salem Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary d-flex align-items-center" style="height: 100vh;">
    <div class="card mx-auto p-4" style="width: 350px;">
        <h4 class="text-center">COE Portal</h4>
        <form action="/login" method="POST">
            <label class="form-label fw-bold">Username </label>
            <input type="text" name="username" class="form-control mb-3" placeholder="Enter Username or ID" required>

            <label class="form-label fw-bold">Password </label>
            <input type="password" name="password" class="form-control mb-4" placeholder="Enter Password or Mobile" required>
            <button class="btn btn-primary w-100">Login</button>
        </form>
    </div>
</body>
</html>

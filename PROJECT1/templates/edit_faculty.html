<!DOCTYPE html>
<html>
<head>
    <title>Edit Faculty - COE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light p-4">
    <div class="container">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="fas fa-user-edit me-2"></i> Edit Faculty Details</h4>
                <a href="/manage_faculty" class="btn btn-sm btn-light">Back to List</a>
            </div>
            <div class="card-body p-4">
                <form action="/update_faculty" method="POST">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Faculty ID (Fixed)</label>
                            <input type="text" name="faculty_id" class="form-control bg-light" value="{{ f.faculty_id }}" readonly>
                        </div>
                        <div class="col-md-8 mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" name="name" class="form-control" value="{{ f.name }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Designation</label>
                            <input type="text" name="designation" class="form-control" value="{{ f.designation }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Department</label>
                            <input type="text" name="department" class="form-control" value="{{ f.department }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Institution Address</label>
                        <textarea name="institution_address" class="form-control" rows="2">{{ f.institution_address }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Mobile Number</label>
                            <input type="text" name="mobile_number" class="form-control" value="{{ f.mobile_number }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" name="email_address" class="form-control" value="{{ f.email_address }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Place/City</label>
                            <input type="text" name="place" class="form-control" value="{{ f.place }}">
                        </div>
                    </div>

                    <div class="bg-light p-3 rounded mb-3">
                        <h6 class="fw-bold border-bottom pb-2 mb-3">Bank Account Information</h6>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="small fw-bold">Bank Name</label>
                                <input type="text" name="bank_name" class="form-control" value="{{ f.bank_name }}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="small fw-bold">Account Number</label>
                                <input type="text" name="account_number" class="form-control" value="{{ f.account_number }}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="small fw-bold">IFSC Code</label>
                                <input type="text" name="ifsc" class="form-control" value="{{ f.ifsc }}">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="small fw-bold">Branch Name</label>
                                <input type="text" name="branch_name" class="form-control" value="{{ f.branch_name }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="small fw-bold">Bank Type (e.g. Nationalized)</label>
                                <input type="text" name="bank_type" class="form-control" value="{{ f.bank_type }}">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Distance (km)</label>
                            <input type="number" step="0.1" name="distance" class="form-control" value="{{ f.distance }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Category</label>
                            <select name="category" class="form-select">
                                <option value="Internal" {% if f.category == 'Internal' %}selected{% endif %}>Internal</option>
                                <option value="External" {% if f.category == 'External' %}selected{% endif %}>External</option>
                            </select>
                        </div>
                    </div>

                    <hr>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success px-4 fw-bold">Save Changes</button>
                        <a href="/manage_faculty" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Valuation & Practical Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .card { border-radius: 12px; border: none; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="p-4">

<div class="container" style="max-width: 600px; margin-top: 50px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary"><i class="fas fa-chalkboard-teacher me-2"></i> Claims Portal</h2>
        <div>
            {% if role == 'admin' %}
            <a href="/dashboard" class="btn btn-outline-secondary fw-bold me-2"><i class="fas fa-arrow-left"></i> Dashboard</a>
            {% endif %}
            <a href="/logout" class="btn btn-danger fw-bold shadow-sm"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>

    <div class="card shadow-lg p-4">
        <h5 class="fw-bold mb-3 text-secondary border-bottom pb-2">Generate Claim Form</h5>
        <form action="/preview_practical_claim" method="POST">
            
            <div class="mb-4">
                <label class="form-label fw-bold text-dark">Select Department / Board</label>
                <select name="department" class="form-select form-select-lg" required>
                    <option value="" disabled selected>-- Choose Department --</option>
                    {% for b in boards %}
                        <option value="{{ b }}">{{ b }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold text-dark">Enter Order Number / S.No</label>
                <input type="text" name="order_no" class="form-control form-control-lg" placeholder="e.g., 1 or 12" required>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow">
                <i class="fas fa-search me-2"></i> Search & Preview Claim
            </button>
        </form>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mt-4">
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
            <strong><i class="fas fa-info-circle"></i></strong> {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

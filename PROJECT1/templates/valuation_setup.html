<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ val_type }} Setup - GCE Salem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h3>{{ val_type }} Valuation Setup</h3>
    <div class="card shadow-sm p-4 mt-3">
        <form method="POST">
            <div class="row mb-3">
                <div class="col-md-4">
                    <label>Academic Year</label>
                    <input type="text" class="form-control" name="academic_year" placeholder="e.g., 2025-2026" required>
                </div>
                <div class="col-md-4">
                    <label>Semester Type</label>
                    <select name="sem_type" class="form-select">
                        <option>Odd</option>
                        <option>Even</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label>Number of Phases</label>
                    <input type="number" class="form-control" name="num_phases" id="num_phases" min="1" max="5" value="1" required>
                </div>
            </div>
            <hr>
            <h5>Phase Dates</h5>
            <div id="phase_dates_container" class="row g-3">
                </div>
            <button type="submit" class="btn btn-success mt-4">Create Valuation Session</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('num_phases').addEventListener('input', function() {
        const num = this.value;
        const container = document.getElementById('phase_dates_container');
        container.innerHTML = '';
        for(let i=1; i<=num; i++) {
            container.innerHTML += `
                <div class="col-md-6">
                    <div class="card p-2 bg-white">
                        <h6>Phase ${i}</h6>
                        <label>Start Date</label><input type="date" name="phase_${i}_start" class="form-control mb-2" required>
                        <label>End Date</label><input type="date" name="phase_${i}_end" class="form-control" required>
                    </div>
                </div>`;
        }
    });
    document.getElementById('num_phases').dispatchEvent(new Event('input')); // Trigger on load
</script>
</body>
</html>
